server {
    listen 80;
    root /usr/share/nginx/html;

    # API -> backend Spring Boot (ten service trong docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File co ma hash trong ten: cache lau dai
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker va manifest: luon lay ban moi nhat
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Ung dung 1 trang (SPA): moi duong dan khac deu tra ve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
