spring.application.name=backend

# --- Database ---
# Gia tri sau dau ":" la mac dinh khi chay tren may (khop docker-compose.yml).
# Khi deploy thi dat bien moi truong DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/expenditure}
spring.datasource.username=${DB_USERNAME:expenditure}
spring.datasource.password=${DB_PASSWORD:expenditure}

# Bang do Flyway tao (db/migration), Hibernate chi kiem tra cho khop.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Loi tra ve dang JSON chuan (RFC 9457 Problem Details), khong lo stack trace ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- JWT ---
# Khoa bi mat ky token, toi thieu 32 ky tu. Ban dev dung gia tri mac dinh,
# khi deploy BAT BUOC dat bien moi truong JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration=7d

# Mui gio cua nguoi dung: dung de hieu "hom nay", "hom qua" va chia theo thang.
app.zone=Asia/Ho_Chi_Minh

# Cho phep frontend goi API tu domain khac (vi du khi deploy rieng). Nhieu domain cach nhau dau phay.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health

springdoc.swagger-ui.path=/swagger-ui.html
